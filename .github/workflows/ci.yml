name: Backend tests

on:
  push:
    branches: ["development", "dev-onuchukwu"] # 'main' branch will need to included back later on.
  pull_request:
    branches: ["development", "dev-onuchukwu"] # 'main' branch will need to included back later on.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DATABASE_CONNECTION_STRING: postgresql://developer:AH1W4MYUWxQ9xBXu@localhost:5432/postgres
  DEBUG: True
  SECRET_KEY: 2f7784f9ecbb658c1c85cd7a674ee08891f722e9079cac8d364001c0a2c702ca424a43922fbd3c3b2612d4e5d91ec69b3180860473a1eab9ec212fc2ae809a1a

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-root

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run ruff format --check .

      - name: Mypy type check
        run: poetry run mypy .

  tests:
    name: Tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: AH1W4MYUWxQ9xBXu
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U developer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://developer:AH1W4MYUWxQ9xBXu@localhost:5432/postgres
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: AH1W4MYUWxQ9xBXu
      POSTGRES_DB: postgres
      POSTGRES_HOSTNAME: localhost
      DATABASE_CONNECTION_STRING: postgresql://developer:AH1W4MYUWxQ9xBXu@localhost:5432/postgres
      DEBUG: True
      SECRET_KEY: 2f7784f9ecbb658c1c85cd7a674ee08891f722e9079cac8d364001c0a2c702ca424a43922fbd3c3b2612d4e5d91ec69b3180860473a1eab9ec212fc2ae809a1a

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-root

      - name: Check for missing migrations
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: |
          poetry run coverage run manage.py test
          poetry run coverage report

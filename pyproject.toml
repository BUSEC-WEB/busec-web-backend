[project]
name = "busec-web-backend"
version = "0.1.0"
description = ""
authors = [
    { name = "Daniel Onuchukwu", email = "114066984+0xfelaback@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "dj-database-url (>=3.1.2,<4.0.0)",
    "pydantic (>=2.14.2,<3.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "django-filter (>=26.2,<27.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false


[dependency-groups]
dev = [
    "ruff (>=0.17.4,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "django-stubs (>=6.1.2,<7.0.0)",
    "coverage (>=7.17.2,<8.0.0)",
    "djangorestframework-stubs (>=3.18.2,<4.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "*/wsgi.py",
    "*/asgi.py",
    "*/settings.py",
]
branch = true

[tool.coverage.report]
fail_under = 70     # With actual implementations, this should take a value of 85
show_missing = true

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["RUF012"]

[tool.ruff.format]
exclude = ["**/migrations/*.py"]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
explicit_package_bases = true

[tool.django-stubs]
django_settings_module = "config.settings"
